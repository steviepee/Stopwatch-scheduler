<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Stopwatch body -->
  <circle cx="256" cy="280" r="170" fill="url(#face)" stroke="rgba(255,255,255,0.3)" stroke-width="8"/>

  <!-- Inner circle -->
  <circle cx="256" cy="280" r="140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Top button -->
  <rect x="236" y="70" width="40" height="50" rx="8" fill="rgba(255,255,255,0.4)"/>

  <!-- Side button -->
  <rect x="400" y="180" width="30" height="50" rx="6" fill="rgba(255,255,255,0.4)"/>

  <!-- Hour markers -->
  <g fill="rgba(255,255,255,0.6)">
    <rect x="252" y="150" width="8" height="25" rx="2"/>
    <rect x="252" y="385" width="8" height="25" rx="2"/>
    <rect x="120" y="276" width="25" height="8" rx="2"/>
    <rect x="367" y="276" width="25" height="8" rx="2"/>
  </g>

  <!-- Clock hands -->
  <line x1="256" y1="280" x2="256" y2="180" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="330" y2="320" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="280" r="12" fill="white"/>

  <!-- Play triangle (indicating start) -->
  <polygon points="240,250 240,310 285,280" fill="rgba(255,255,255,0.3)"/>
</svg>
